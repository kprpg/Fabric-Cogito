<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1590" viewBox="0 0 2000 1590" role="img" aria-labelledby="title desc">
  <title id="title">Fabric cross-tenant access: practical implementation responsibility swimlane</title>
  <desc id="desc">A non-PHI Warehouse pilot separates guest administrator, Microsoft Fabric service, and provider administrator responsibilities: provider enablement and Graph permission; guest directory setup and consent; mapping; automatic local identity creation; item Read and curated-view SELECT; guest-specific connection-string handoff; guest MFA sign-in; and acceptance testing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#245b78"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17334a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #496378; }
      .lane { font-size: 25px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #496378; }
      .tiny { font-size: 15px; fill: #496378; }
      .card { fill: #fff; stroke: #a6bdcc; stroke-width: 1.5; }
      .line { fill: none; stroke: #245b78; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="2000" height="1590" fill="#f7f9fc"/>
  <text x="50" y="62" class="title">Practical implementation: approved guest to curated Warehouse view</text>
  <text x="50" y="100" class="subtitle">Separate human administration, Fabric-managed side effects, and runtime access - synthetic data only</text>
  <rect x="50" y="130" width="1900" height="58" rx="10" fill="#fff4d8" stroke="#c99b3e"/>
  <text x="74" y="166" class="body">Provider = Epic only if tenant ownership and feature use are confirmed. This is a reference runbook, not an executed deployment.</text>

  <rect x="50" y="223" width="560" height="1126" rx="16" fill="#edf5ff" stroke="#6799c7" stroke-width="2"/>
  <rect x="660" y="223" width="600" height="1126" rx="16" fill="#f2effa" stroke="#9d8ebf" stroke-width="2"/>
  <rect x="1310" y="223" width="640" height="1126" rx="16" fill="#eaf7f4" stroke="#479887" stroke-width="2"/>
  <text x="80" y="267" class="lane">Guest / hospital administrators</text>
  <text x="690" y="267" class="lane">Microsoft Fabric / Entra services</text>
  <text x="1340" y="267" class="lane">Provider administrators / data owner</text>

  <rect x="1340" y="306" width="580" height="132" rx="12" class="card"/>
  <text x="1362" y="342" class="heading">0. Confirm provider enablement</text>
  <text x="1362" y="376" class="body">Microsoft limited-preview acceptance / enablement</text>
  <text x="1362" y="407" class="small">Correct Fabric application has Graph Group.Create</text>

  <rect x="80" y="346" width="500" height="150" rx="12" class="card"/>
  <text x="102" y="382" class="heading">1. Prepare the guest directory</text>
  <text x="102" y="416" class="body">Native pilot reader group and approved users</text>
  <text x="102" y="448" class="body">Power BI Service and Azure SQL local SPs</text>
  <text x="102" y="478" class="small">Verify Microsoft's prescribed application IDs</text>
  <path d="M330 496 V562" class="line"/>

  <rect x="80" y="574" width="500" height="132" rx="12" class="card"/>
  <text x="102" y="610" class="heading">2. Consent to the named provider</text>
  <text x="102" y="644" class="body">Guest Global Administrator</text>
  <text x="102" y="676" class="small">Tenant.ReadWrite.All; resourceTenantObjectId</text>
  <rect x="690" y="574" width="540" height="132" rx="12" class="card"/>
  <text x="712" y="610" class="heading">Tenant trust gate is recorded</text>
  <text x="712" y="644" class="body">Power BI cross-tenant consent REST endpoint</text>
  <text x="712" y="676" class="small">Mapping before consent returns documented 401</text>
  <path d="M580 640 H680" class="line"/>
  <path d="M960 706 V736 H1630 V766" class="line"/>
  <text x="1030" y="726" class="tiny">Consent must exist before mapping</text>

  <rect x="1340" y="778" width="580" height="128" rx="12" class="card"/>
  <text x="1362" y="814" class="heading">3. Map the approved guest group</text>
  <text x="1362" y="847" class="body">Provider Fabric administrator calls mappings API</text>
  <text x="1362" y="879" class="small">Guest tenant GUID + guest group object GUID</text>
  <rect x="690" y="778" width="540" height="128" rx="12" class="card"/>
  <text x="712" y="814" class="heading">4. Fabric projects the identity</text>
  <text x="712" y="847" class="body">Creates provider-side managed group / SPs</text>
  <text x="712" y="879" class="small">Do not manually modify or delete these objects</text>
  <path d="M1340 842 H1240" class="line"/>

  <rect x="1340" y="960" width="580" height="132" rx="12" class="card"/>
  <text x="1362" y="996" class="heading">5. Grant the intended access only</text>
  <text x="1362" y="1030" class="body">Warehouse item Read + SELECT on curated view</text>
  <text x="1362" y="1062" class="small">No default whole-workspace Viewer / broad ReadData</text>
  <path d="M1230 864 H1284 V1026 H1330" class="line"/>

  <rect x="690" y="1130" width="540" height="138" rx="12" class="card"/>
  <text x="712" y="1166" class="heading">6. Generate guest-specific connection string</text>
  <text x="712" y="1200" class="body">Provider calls Warehouse connectionString API</text>
  <text x="712" y="1232" class="small">guestTenantId; exact returned endpoint and database</text>
  <path d="M1630 1092 V1110 H960 V1120" class="line"/>
  <text x="1328" y="1134" class="tiny">Provider-side API identity</text>

  <rect x="80" y="1130" width="500" height="138" rx="12" class="card"/>
  <text x="102" y="1166" class="heading">7. Connect with home-tenant MFA</text>
  <text x="102" y="1200" class="body">SSMS uses the actual handed-off endpoint</text>
  <text x="102" y="1232" class="small">Approved network path; MSSQL / TDS on TCP 1433</text>
  <path d="M690 1198 H590" class="line"/>
  <text x="80" y="1109" class="tiny">Guest receives connection details, not credentials for Fabric's managed proxy.</text>

  <rect x="80" y="1379" width="1840" height="92" rx="14" fill="#fff" stroke="#627f94" stroke-width="2"/>
  <text x="104" y="1416" class="heading">8. Acceptance: allowed view, denied base table / unrelated item, audit evidence, membership timing, and revocation</text>
  <text x="104" y="1450" class="small">Consent revocation can take a day and does not terminate existing sessions. Private-only guest connectivity is a separate deployment gate.</text>
  <path d="M330 1268 V1369" class="line"/>

  <a href="https://learn.microsoft.com/en-us/fabric/enterprise/cross-tenant-access"><text x="50" y="1513" class="tiny">Sources: Guest setup</text></a>
  <a href="https://learn.microsoft.com/en-us/fabric/enterprise/cross-tenant-access-for-providers"><text x="300" y="1513" class="tiny">Provider setup / governance</text></a>
  <a href="https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-granular-permissions"><text x="655" y="1513" class="tiny">SQL granular permissions</text></a>
  <a href="https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions"><text x="990" y="1513" class="tiny">Warehouse sharing permissions</text></a>
  <text x="50" y="1550" class="tiny">See accompanying report for full prerequisites, correctly separated Warehouse / SQLEndpoint APIs, sample requests, uncertainties, and test expectations.</text>
</svg>
