#cloud-config
# NAT forwarder: DNAT inbound TCP/__TARGET_PORT__ to the on-premises SQL Server and MASQUERADE so replies return here.
write_files:
  - path: /etc/sysctl.d/99-ipforward.conf
    content: |
      net.ipv4.ip_forward=1
  - path: /usr/local/sbin/nat-forwarder.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      sysctl -w net.ipv4.ip_forward=1
      iptables -t nat -F
      iptables -t nat -A PREROUTING -p tcp --dport __TARGET_PORT__ -j DNAT --to-destination __TARGET_IP__:__TARGET_PORT__
      iptables -t nat -A POSTROUTING -j MASQUERADE
  - path: /etc/systemd/system/nat-forwarder.service
    content: |
      [Unit]
      Description=DNAT to on-premises SQL Server
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/nat-forwarder.sh
      [Install]
      WantedBy=multi-user.target
runcmd:
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now nat-forwarder.service
